<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#4F46E5" />
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('quiz-clash-ui-prefs');
          var theme = raw ? JSON.parse(raw).theme : 'light';
          var resolved =
            theme === 'system'
              ? window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
              : theme === 'dark'
              ? 'dark'
              : 'light';
          document.documentElement.setAttribute('data-theme', resolved);
          document.documentElement.classList.toggle('dark', resolved === 'dark');
          document.documentElement.classList.toggle('light', resolved !== 'dark');
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+Myanmar:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>QuizClash · QuizClash — Study notes → active recall</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
